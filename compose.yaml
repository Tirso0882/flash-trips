services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flash_trips
      POSTGRES_PASSWORD: local-postgres-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flash_trips"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./scripts/postgres/init-local.sql:/docker-entrypoint-initdb.d/init-local.sql:ro
      - flash-trips-postgres:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - flash-trips-azurite:/data

volumes:
  flash-trips-azurite:
  flash-trips-postgres:
