[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flash-trips"
version = "0.1.0"
description = "Evidence-backed private trip planning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "import-linter>=2.3,<3",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "psycopg[binary]>=3.2,<4",
  "pyright>=1.1.404,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-socket>=0.7,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flash_trips"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --disable-socket --allow-unix-socket"
testpaths = ["tests"]
markers = [
  "persistence: requires a real PostgreSQL database",
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/flash_trips/adapters/postgres/migrations/versions"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603"]
